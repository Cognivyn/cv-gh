name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: cv-gh-linux-x86_64.tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: cv-gh-darwin-aarch64.tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: cv-gh-windows-x86_64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --package cv-gh --target ${{ matrix.target }}
      - name: Package Unix artifact
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release cv-gh
      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release cv-gh.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
